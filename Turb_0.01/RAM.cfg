%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 Configuration File                                                       %
% Case : Chen-Sajben-Kroutil Transonic Diffuser                                %
% Solver : Unsteady Compressible RANS SST                                      %
% Version : SU2 v8.x Compatible                                                %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------------------ GENERAL --------------------------------------------

SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
SYSTEM_MEASUREMENTS= SI
RESTART_SOL= NO
WRT_RESTART_COMPACT= YES

% ------------------------ MESH ------------------------------------------------

MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

% ------------------------ GAS MODEL ------------------------------------------

GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.0

% ------------------------ FREESTREAM -----------------------------------------

FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0

% ------------------------ REFERENCE VALUES -----------------------------------

REYNOLDS_NUMBER= 1.0E6
REYNOLDS_LENGTH= 0.01

% ------------------------ INITIALIZATION -------------------------------------

INIT_OPTION= TD_CONDITIONS
MACH_NUMBER= 0.20

% ------------------------ UNSTEADY -------------------------------------------

TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER

TIME_STEP= 5.0E-5
TIME_ITER= 3000
INNER_ITER= 80

% ------------------------ CFL -------------------------------------------------

CFL_NUMBER= 0.20
CFL_ADAPT= NO

% ------------------------ NUMERICS -------------------------------------------

NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES

CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= NO

CONV_NUM_METHOD_TURB= SCALAR_UPWIND

TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT

ENTROPY_FIX_COEFF= 0.20
VENKAT_LIMITER_COEFF= 0.02

% ------------------------ LINEAR SOLVER --------------------------------------

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_ERROR= 1E-2
LINEAR_SOLVER_ITER= 20

% ------------------------ BOUNDARY CONDITIONS --------------------------------

MARKER_INLET= ( INLET, 300.0, 135775.0, 1.0, 0.0, 0.0 )

MARKER_OUTLET= ( OUTLET, 101325.0 )

MARKER_HEATFLUX= ( TOPWALL, 0.0, BOTWALL, 0.0 )

% If bottom wall should be slip, replace previous line with:
% MARKER_HEATFLUX= ( TOPWALL, 0.0 )
% MARKER_EULER= ( BOTWALL )

% ------------------------ CONVERGENCE ----------------------------------------

CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -6
CONV_STARTITER= 0

% ------------------------ SCREEN/HISTORY -------------------------------------

SCREEN_WRT_FREQ_INNER= 1
HISTORY_WRT_FREQ_INNER= 1

% Leave SCREEN_OUTPUT and HISTORY_OUTPUT out for now because your build
% previously crashed on parser issues. After confirming the run is stable,
% we can add supported residual variables.

% ------------------------ OUTPUT FILES ---------------------------------------

CONV_FILENAME= convergence_unsteady

VOLUME_FILENAME= soln_volume_unsteady
SURFACE_FILENAME= soln_surface_unsteady

RESTART_FILENAME= restart_unsteady

OUTPUT_FILES= ( PARAVIEW )

OUTPUT_WRT_FREQ= 50

TABULAR_FORMAT= CSV