%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 Configuration: 2D Converging Duct (Near-Isentropic, RANS-SST)
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ---------------- PROBLEM DEFINITION ---------------- %
SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% ---------------- TIME ---------------- %
TIME_DOMAIN= NO

% ---------------- GAS MODEL ---------------- %
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.0

% ---------------- INITIALIZATION ---------------- %
MACH_NUMBER= 0.2
INIT_OPTION= TD_CONDITIONS
REF_DIMENSIONALIZATION= DIMENSIONAL

% ---------------- BOUNDARY CONDITIONS ---------------- %
% Inlet: Total pressure and temperature
MARKER_INLET= ( INLET, 300.0, 200000.0, 1.0, 0.0, 0.0 )

% Outlet: Static pressure (isentropic, M ≈ 0.95)
MARKER_OUTLET= ( OUTLET, 112000.0 )


% Wall: No-slip, adiabatic
MARKER_HEATFLUX= ( WALL, 0.0 )

% Symmetry
MARKER_SYM= ( SYMMETRY )

MARKER_PLOTTING= ( WALL )
MARKER_MONITORING= ( WALL )

% ---------------- TURBULENCE ---------------- %
FREESTREAM_TURBULENCEINTENSITY= 0.05

% ---------------- NUMERICS ---------------- %
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 2
CFL_ADAPT= NO

MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.005
MUSCL_TURB= NO

CONV_NUM_METHOD_FLOW= ROE
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT

% ---------------- CONVERGENCE ---------------- %
ITER= 5000
CONV_RESIDUAL_MINVAL= -6

% ---------------- INPUT / OUTPUT ---------------- %
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

OUTPUT_WRT_FREQ= 200
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )

SCREEN_OUTPUT= ( ITER, RMS_DENSITY, RMS_MOMENTUM-X, RMS_ENERGY )
HISTORY_OUTPUT= ( ITER, RMS_RES )
