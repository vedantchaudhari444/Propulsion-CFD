%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% Chen Diffuser - v = 1.34
% Unsteady Laminar (Slip Bottom, No-Slip Top)
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= NAVIER_STOKES
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% -------------------- UNSTEADY SETUP ----------------------------------------%
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER

TIME_STEP= 5.0e-5
TIME_ITER= 8000
INNER_ITER= 40
CONV_RESIDUAL_MINVAL= -6

% -------------------- INITIALIZATION ----------------------------------------%
INIT_OPTION= TD_CONDITIONS
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0
REF_DIMENSIONALIZATION= DIMENSIONAL

% -------------------- BOUNDARY CONDITIONS -----------------------------------%
MARKER_INLET= ( INLET, 300.0, 135775.5, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( OUTLET, 101325.0 )

MARKER_HEATFLUX= ( TOPWALL, 0.0 )
MARKER_EULER= ( BOTWALL )

MARKER_PLOTTING= ( TOPWALL, BOTWALL )
MARKER_MONITORING= ( TOPWALL, BOTWALL )

% -------------------- NUMERICS ----------------------------------------------%
NUM_METHOD_GRAD= GREEN_GAUSS

CFL_NUMBER= 0.8
CFL_ADAPT= NO

MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05

CONV_NUM_METHOD_FLOW= ROE
ENTROPY_FIX_COEFF= 0.1
TIME_DISCRE_FLOW= EULER_IMPLICIT

% ------------------------- I/O ----------------------------------------------%
MESH_FILENAME= CHEN_MESH.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV

OUTPUT_WRT_FREQ= 200
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )

SCREEN_OUTPUT= (TIME_ITER, RMS_DENSITY, MIN_PRESSURE)
HISTORY_OUTPUT= (TIME_ITER, RMS_DENSITY)
