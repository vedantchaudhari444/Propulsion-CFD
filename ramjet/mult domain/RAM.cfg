%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 Config (FINAL - ERROR FREE)
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

TIME_DOMAIN= NO

% ---------------- GAS ---------------- %
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.0

% ---------------- INIT ---------------- %
MACH_NUMBER= 0.2
INIT_OPTION= TD_CONDITIONS
REF_DIMENSIONALIZATION= DIMENSIONAL

% ---------------- BOUNDARIES ---------------- %

% Inlet
MARKER_INLET= ( INLET, 300.0, 200000.0, 1.0, 0.0, 0.0 )

% Outlet
MARKER_OUTLET= ( OUTLET, 100000.0 )

% Top walls
MARKER_HEATFLUX= ( TOPWALL_1, 0.0, TOPWALL_2, 0.0 )

% Bottom symmetry
MARKER_SYM= ( BOTWALL_1, BOTWALL_2 )

% 🔴 Interface treated as wall (neutral fallback)
MARKER_EULER= ( INTERFACE_1, INTERFACE_2 )

% Monitoring
MARKER_MONITORING= ( TOPWALL_1, TOPWALL_2 )
MARKER_PLOTTING= ( TOPWALL_1, TOPWALL_2 )

% ---------------- TURBULENCE ---------------- %
FREESTREAM_TURBULENCEINTENSITY= 0.01

% ---------------- NUMERICS ---------------- %
NUM_METHOD_GRAD= GREEN_GAUSS

CFL_NUMBER= 3.0
CFL_ADAPT= NO

MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.02

CONV_NUM_METHOD_FLOW= ROE
ENTROPY_FIX_COEFF= 0.05

TIME_DISCRE_FLOW= EULER_IMPLICIT

% ---------------- CONVERGENCE ---------------- %
ITER= 8000
CONV_RESIDUAL_MINVAL= -7

% ---------------- FILES ---------------- %
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

OUTPUT_WRT_FREQ= 200
OUTPUT_FILES= ( RESTART, PARAVIEW )

SCREEN_OUTPUT= ( ITER, RMS_DENSITY, RMS_MOMENTUM-X, RMS_ENERGY )
HISTORY_OUTPUT= ( ITER, RMS_RES )