%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 Configuration File
% 3D Compressible Internal Flow
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ---------------- PROBLEM DEFINITION ---------------- %
SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% ---------------- TIME ---------------- %
TIME_DOMAIN= NO

% ---------------- GAS MODEL ---------------- %
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.0

% ---------------- INITIALIZATION ---------------- %
MACH_NUMBER= 0.2
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0

INIT_OPTION= TD_CONDITIONS
REF_DIMENSIONALIZATION= DIMENSIONAL

% ---------------- BOUNDARY CONDITIONS ---------------- %

% Total Temperature (K), Total Pressure (Pa), Flow Direction
MARKER_INLET= ( Inlet, 354.0, 200000.0, 1.0, 0.0, 0.0 )

% Static Pressure (Pa)
MARKER_OUTLET= ( Outlet, 111800.0 )

% No-slip adiabatic walls
MARKER_HEATFLUX= ( Topwall, 0.0, Wall, 0.0 )

% Symmetry Plane
MARKER_SYM= ( Botwall )

% ---------------- TURBULENCE ---------------- %
FREESTREAM_TURBULENCEINTENSITY= 0.01

% ---------------- NUMERICS ---------------- %
NUM_METHOD_GRAD= GREEN_GAUSS

CFL_NUMBER= 3.0
CFL_ADAPT= NO

MUSCL_FLOW= NO
MUSCL_TURB= NO

SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.02

CONV_NUM_METHOD_FLOW= JST
ENTROPY_FIX_COEFF= 0.05

TIME_DISCRE_FLOW= EULER_IMPLICIT

% ---------------- CONVERGENCE ---------------- %
ITER= 40000
CONV_RESIDUAL_MINVAL= -6

% ---------------- INPUT / OUTPUT ---------------- %

MESH_FILENAME= newmesh.su2
MESH_FORMAT= SU2

TABULAR_FORMAT= CSV

CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface

OUTPUT_WRT_FREQ= 100

OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )

MARKER_PLOTTING= ( Topwall, Botwall, Wall )
MARKER_MONITORING= ( Topwall, Botwall, Wall )

SCREEN_OUTPUT= ( ITER, RMS_DENSITY, RMS_MOMENTUM-X, RMS_MOMENTUM-Y, RMS_MOMENTUM-Z, RMS_ENERGY )