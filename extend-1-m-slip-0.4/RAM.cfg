%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 Configuration File
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

TIME_DOMAIN= NO

% ---------------- FLOW ---------------- %
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.0

% ---------------- INITIALIZATION ---------------- %
MACH_NUMBER= 0.2
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 300.0

INIT_OPTION= TD_CONDITIONS
REF_DIMENSIONALIZATION= DIMENSIONAL

% ---------------- BOUNDARY CONDITIONS ---------------- %

MARKER_INLET= ( INLET, 354.0, 200000.0, 1.0, 0.0, 0.0 )

MARKER_OUTLET= ( OUTLET, 179120.0 )

% Top wall =  slip 
MARKER_EULER = ( TOPWALL, 0.0 )

% Bottom wall = symmetry
MARKER_SYM= ( BOTWALL )

% ---------------- TURBULENCE ---------------- %
FREESTREAM_TURBULENCEINTENSITY= 0.01

% ---------------- NUMERICS ---------------- %
NUM_METHOD_GRAD= GREEN_GAUSS

CFL_NUMBER= 3.0
CFL_ADAPT= NO

MUSCL_FLOW= NO
MUSCL_TURB= NO

SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.02

CONV_NUM_METHOD_FLOW= JST
ENTROPY_FIX_COEFF= 0.05

TIME_DISCRE_FLOW= EULER_IMPLICIT

% ---------------- CONVERGENCE ---------------- %
ITER= 40000
CONV_RESIDUAL_MINVAL= -10

% ---------------- INPUT / OUTPUT ---------------- %

MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2

TABULAR_FORMAT= CSV

CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface

OUTPUT_WRT_FREQ= 100

OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
MARKER_PLOTTING= ( TOPWALL )
MARKER_MONITORING= ( TOPWALL )
SCREEN_OUTPUT= ( ITER, RMS_DENSITY, RMS_MOMENTUM-X, RMS_ENERGY )